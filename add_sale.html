{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Sale</h2>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label for="date">Sale Date</label>
                <input name="date" type="date" required id="date" value="{{ values.get('date', '') }}">
            </div>
            <div class="form-group">
                <label for="sold_price">Sold Price</label>
                <input name="sold_price" type="number" step="0.01" min="0.01" required id="sold_price" value="{{ values.get('sold_price', '') }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="customer_id">Customer ID</label>
                <input name="customer_id" type="number" min="1" required id="customer_id" value="{{ values.get('customer_id', '') }}">
            </div>
            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input name="employee_id" type="number" min="1" required id="employee_id" value="{{ values.get('employee_id', '') }}">
            </div>
            <div class="form-group">
                <label for="vin">VIN</label>
                <input name="vin" type="text" required id="vin" value="{{ values.get('vin', '') }}">
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Sale</button>
        <a href="{{ url_for('web.sales') }}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
