name: Tests
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q InterfaceDatabase.py db.py manage.py validation.py tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
