{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Dealership</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Dealership ID</label>
                <input name="id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input name="address" type="text" required>
            </div>
            <div class="form-group">
                <label>City</label>
                <input name="city" type="text" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>State</label>
                <input name="state" type="text" maxlength="2" placeholder="TX" required>
            </div>
            <div class="form-group">
                <label>Zip Code</label>
                <input name="zipcode" type="text" maxlength="10" placeholder="75201" required>
            </div>
            <div class="form-group"></div>
        </div>
        <button type="submit" class="btn btn-success">Add Dealership</button>
        <a href="/dealerships" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
