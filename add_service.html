{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Service Record</h2>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label for="date">Service Date</label>
                <input name="date" type="date" required id="date" value="{{ values.get('date', '') }}">
            </div>
            <div class="form-group">
                <label for="service_done">Service Done</label>
                <select name="service_done" required id="service_done">
                    {% for option in service_types %}
                    <option{% if values.get('service_done') == option %} selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="vin">VIN</label>
                <input name="vin" type="text" required id="vin" value="{{ values.get('vin', '') }}">
            </div>
            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input name="employee_id" type="number" min="1" required id="employee_id" value="{{ values.get('employee_id', '') }}">
            </div>
            <div class="form-group">
                <label for="cost">Cost</label>
                <input name="cost" type="number" step="0.01" min="0.01" required id="cost" value="{{ values.get('cost', '') }}">
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Service Record</button>
        <a href="{{ url_for('web.services') }}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
