{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Service Record</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Service ID</label>
                <input name="id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>Service Date</label>
                <input name="date" type="date" required>
            </div>
            <div class="form-group">
                <label>Service Done</label>
                <select name="service_done" required>
                    <option>Oil Change</option>
                    <option>Brakes</option>
                    <option>Tires</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>VIN</label>
                <input name="vin" type="text" required>
            </div>
            <div class="form-group">
                <label>Employee ID (Mechanic)</label>
                <input name="employee_id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>Cost</label>
                <input name="cost" type="number" step="0.01" min="0.01" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Service Record</button>
        <a href="/services" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
