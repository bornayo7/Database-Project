{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Appointment</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Appointment ID</label>
                <input name="id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>Appointment Date</label>
                <input name="date" type="date" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status" required>
                    <option>Scheduled</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                    <option>Delayed</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Customer ID</label>
                <input name="customer_id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>Employee ID</label>
                <input name="employee_id" type="number" min="1" required>
            </div>
            <div class="form-group">
                <label>VIN</label>
                <input name="vin" type="text" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Dealership ID</label>
                <input name="dealership_id" type="number" min="1" required>
            </div>
            <div class="form-group"></div>
            <div class="form-group"></div>
        </div>
        <button type="submit" class="btn btn-success">Add Appointment</button>
        <a href="/appointments" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
