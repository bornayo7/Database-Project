{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Customer</h2>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name</label>
                <input name="name" type="text" required id="name" value="{{ values.get('name', '') }}">
            </div>
            <div class="form-group">
                <label for="credit">Credit Score</label>
                <input name="credit" type="number" min="300" max="850" required id="credit" value="{{ values.get('credit', '') }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input name="email" type="email" required id="email" value="{{ values.get('email', '') }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input name="phone" type="text" id="phone" value="{{ values.get('phone', '') }}">
            </div>
            <div class="form-group">
                <label for="loan">Loan Amount (optional)</label>
                <input name="loan" type="number" step="0.01" min="0.01" id="loan" value="{{ values.get('loan', '') }}">
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Customer</button>
        <a href="{{ url_for('web.customers') }}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
