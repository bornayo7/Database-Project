<!DOCTYPE html>
<html>
<head>
    <title>Car Dealership</title>
    <style>
        /* ==============================
           Design tokens
           ============================== */
        :root {
            /* Primary — sophisticated slate */
            --primary-900: #0b1220;
            --primary-800: #1e293b;
            --primary-700: #334155;
            --primary-600: #475569;
            --primary-500: #64748b;
            --primary-100: #e2e8f0;
            --primary-50:  #f1f5f9;

            /* Brand — electric blue (CTAs, focus, links) */
            --brand-700: #1d4ed8;
            --brand-600: #2563eb;
            --brand-500: #3b82f6;
            --brand-400: #60a5fa;
            --brand-100: #dbeafe;

            /* Gold — for revenue / value highlights */
            --gold-700: #b45309;
            --gold-600: #d97706;
            --gold-500: #f59e0b;
            --gold-400: #fbbf24;
            --gold-100: #fef3c7;

            /* Success — green */
            --success-700: #047857;
            --success-600: #059669;
            --success-500: #10b981;
            --success-100: #d1fae5;

            /* Danger — red */
            --danger-700: #b91c1c;
            --danger-600: #dc2626;
            --danger-500: #ef4444;
            --danger-100: #fee2e2;

            /* Purple accent for variety */
            --purple-600: #7c3aed;
            --purple-500: #8b5cf6;
            --purple-100: #ede9fe;

            /* Neutrals */
            --bg:           #f8fafc;
            --surface:      #ffffff;
            --text:         #0f172a;
            --text-muted:   #64748b;
            --border:       #e2e8f0;
            --border-strong:#cbd5e1;

            --radius:       14px;
            --radius-sm:    8px;

            --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
            --shadow-md: 0 4px 6px -1px rgba(15,23,42,.06), 0 10px 15px -3px rgba(15,23,42,.08);
            --shadow-lg: 0 20px 25px -5px rgba(15,23,42,.12), 0 8px 10px -6px rgba(15,23,42,.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(900px 500px at 100% -10%, rgba(59,130,246,0.10), transparent 60%),
                radial-gradient(700px 400px at -10% 110%, rgba(245,158,11,0.08), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        /* ==============================
           Navigation
           ============================== */
        nav {
            background: linear-gradient(90deg, var(--primary-900) 0%, var(--primary-800) 60%, #1c2742 100%);
            padding: 14px 32px;
            display: flex;
            gap: 4px;
            align-items: center;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        nav a {
            color: rgba(255,255,255,0.78);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            transition: background 0.18s ease, color 0.18s ease;
        }
        nav a:hover { background: rgba(255,255,255,0.10); color: white; }
        nav a.brand {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-right: 24px;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #ffffff 0%, var(--brand-400) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==============================
           Layout
           ============================== */
        .container { max-width: 1280px; margin: 32px auto; padding: 0 24px; }

        h1, .page-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary-900);
            margin-bottom: 24px;
            letter-spacing: -0.6px;
        }

        /* ==============================
           Cards
           ============================== */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .card h2 {
            margin-bottom: 20px;
            color: var(--primary-900);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* ==============================
           Dashboard stats — color-coded accents
           ============================== */
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(160deg, var(--primary-800) 0%, var(--primary-900) 100%);
            border-radius: var(--radius);
            padding: 26px 18px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.6px;
        }
        .stat-card .label {
            color: rgba(255,255,255,0.62);
            margin-top: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }
        a.stat-card { text-decoration: none; color: inherit; display: block; }
        a.stat-card:visited { text-decoration: none; color: inherit; }

        /* ==============================
           Tables
           ============================== */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        th, td { padding: 12px 16px; text-align: left; }
        th {
            background: linear-gradient(180deg, var(--primary-800), var(--primary-900));
            color: white;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        td {
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text);
        }
        tr:nth-child(even) td { background: var(--primary-50); }
        tr:not(:first-child):hover td { background: var(--brand-100); }
        tr:last-child td { border-bottom: none; }

        /* ==============================
           Buttons — distinct semantic colors
           ============================== */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            line-height: 1.2;
            transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
            font-family: inherit;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary {
            background: linear-gradient(180deg, var(--brand-500), var(--brand-600));
            color: white;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(37,99,235,0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(180deg, var(--brand-600), var(--brand-700));
            box-shadow: 0 4px 12px rgba(37,99,235,0.35);
        }
        .btn-success {
            background: linear-gradient(180deg, var(--success-500), var(--success-600));
            color: white;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(5,150,105,0.25);
        }
        .btn-success:hover {
            background: linear-gradient(180deg, var(--success-600), var(--success-700));
            box-shadow: 0 4px 12px rgba(5,150,105,0.35);
        }
        .btn-secondary {
            background: white;
            color: var(--primary-800);
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-sm);
        }
        .btn-secondary:hover {
            background: var(--primary-50);
            border-color: var(--primary-600);
        }
        .btn-danger {
            background: linear-gradient(180deg, var(--danger-500), var(--danger-600));
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(220,38,38,0.25);
        }
        .btn-danger:hover {
            background: linear-gradient(180deg, var(--danger-600), var(--danger-700));
            box-shadow: 0 4px 12px rgba(220,38,38,0.35);
        }
        .btn + .btn { margin-left: 8px; }

        /* ==============================
           Forms
           ============================== */
        form .form-group { margin-bottom: 16px; }
        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }
        form input, form select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: white;
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
        }
        form input:focus, form select:focus {
            outline: none;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
        }
        form input::placeholder { color: #94a3b8; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        /* ==============================
           Flash messages
           ============================== */
        .flash-success {
            background: var(--success-100);
            color: var(--success-700);
            border-left: 4px solid var(--success-500);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-weight: 500;
        }
        .flash-error {
            background: var(--danger-100);
            color: var(--danger-700);
            border-left: 4px solid var(--danger-500);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-weight: 500;
        }

        /* ==============================
           Action cards — color-coded by intent
           ============================== */
        .action-card {
            background: linear-gradient(160deg, var(--primary-800) 0%, var(--primary-900) 100%);
            border-radius: var(--radius);
            padding: 38px 28px;
            text-align: center;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            display: block;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .action-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
        }
        .action-card::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
        }
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .action-card:hover::after { transform: scaleX(1); }
        .action-card:visited { color: inherit; }
        .action-card .action-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .action-card .action-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.65);
        }
        .dashboard-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        /* ==============================
           Filter bar
           ============================== */
        .filter-bar {
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar > span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-right: 4px;
        }
        .filter-bar a {
            padding: 7px 14px;
            background: white;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .filter-bar a:hover {
            border-color: var(--brand-500);
            color: var(--brand-700);
            background: var(--brand-100);
        }
        .filter-bar a.active {
            background: linear-gradient(180deg, var(--brand-500), var(--brand-600));
            color: white;
            border-color: var(--brand-600);
            box-shadow: 0 2px 6px rgba(37,99,235,0.30);
        }

        /* ==============================
           Status badges — semantic colors
           ============================== */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: var(--primary-100);
            color: var(--primary-800);
            border: 1px solid var(--border-strong);
        }
        .badge-available, .badge-scheduled {
            background: var(--brand-100);
            color: var(--brand-700);
            border-color: #bfdbfe;
        }
        .badge-sold, .badge-completed {
            background: var(--success-100);
            color: var(--success-700);
            border-color: #a7f3d0;
        }
        .badge-reserved, .badge-delayed {
            background: var(--gold-100);
            color: var(--gold-700);
            border-color: #fde68a;
        }
        .badge-cancelled {
            background: var(--danger-100);
            color: var(--danger-700);
            border-color: #fecaca;
        }

        /* ==============================
           Metric strip — slate body + gold accent
           ============================== */
        .metric-strip {
            display: inline-flex;
            align-items: baseline;
            gap: 14px;
            background: linear-gradient(160deg, var(--primary-800) 0%, var(--primary-900) 100%);
            color: white;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .metric-strip::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-400), var(--gold-600));
        }
        .metric-strip .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.1px;
            font-weight: 700;
            color: rgba(255,255,255,0.62);
        }
        .metric-strip .metric-value {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
            background: linear-gradient(90deg, var(--gold-400), #fde68a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-lead {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 14px;
            max-width: 900px;
        }
        .subtle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 12px;
        }
        .table-scroll {
            overflow-x: auto;
        }
        .table-scroll table {
            min-width: 720px;
            margin-top: 0;
        }
        code {
            background: var(--primary-50);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px 6px;
            color: var(--primary-900);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            white-space: nowrap;
        }
        .schema-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 0;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .summary-card {
            background: var(--primary-50);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
        }
        .summary-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-weight: 700;
        }
        .summary-value {
            color: var(--primary-900);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-top: 6px;
        }
        .diagram-frame-wrap {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--primary-50);
        }
        .diagram-frame {
            display: block;
            width: 100%;
            min-height: 560px;
            border: 0;
        }
        .diagram-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .diagram-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .diagram-panel h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-900);
        }
        .diagram-image {
            display: block;
            width: 100%;
            height: auto;
            background: white;
        }
        .relationship-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .relationship-pill {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--primary-50);
        }
        .relationship-source,
        .relationship-target {
            width: 100%;
        }
        .relationship-source code,
        .relationship-target code {
            display: block;
            width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .relationship-arrow {
            color: var(--brand-600);
            font-size: 18px;
            font-weight: 800;
            flex-shrink: 0;
        }
        .entity-card {
            scroll-margin-top: 90px;
        }
        .entity-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }
        .entity-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }
        .schema-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .schema-pill-primary {
            background: var(--brand-100);
            border-color: #bfdbfe;
            color: var(--brand-700);
        }
        .schema-pill-foreign {
            background: var(--gold-100);
            border-color: #fde68a;
            color: var(--gold-700);
        }
        .schema-pill-neutral {
            background: var(--primary-50);
            color: var(--primary-700);
        }

        /* ==============================
           Responsive
           ============================== */
        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
            .dashboard-actions { grid-template-columns: 1fr 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
            .diagram-grid { grid-template-columns: 1fr; }
            .entity-header { flex-direction: column; }
            .entity-meta { justify-content: flex-start; }
            nav { padding: 12px 16px; flex-wrap: wrap; gap: 2px; }
            nav a.brand { margin-right: 12px; }
            .container { margin: 20px auto; padding: 0 16px; }
            .card { padding: 20px; }
            .diagram-frame { min-height: 420px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">Car Dealership</a>
        <a href="/customers?mode=view">Customers</a>
        <a href="/vehicles?mode=view">Vehicles</a>
        <a href="/employees?mode=view">Employees</a>
        <a href="/dealerships?mode=view">Dealerships</a>
        <a href="/sales?mode=view">Sales</a>
        <a href="/services?mode=view">Service Records</a>
        <a href="/appointments?mode=view">Appointments</a>
        <a href="/supporting-schema">Supporting Schema</a>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
