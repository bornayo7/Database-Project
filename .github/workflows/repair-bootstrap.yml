name: Repair validation
on:
  push:
    branches: [fix/audit-reliability-20260906]
    paths: [.github/workflows/repair-bootstrap.yml]
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed asset transformations
        run: |
          python .repair_assets.py .
          mv .repair_tests.yml .github/workflows/tests.yml
          rm .repair_assets.py .github/workflows/repair-bootstrap.yml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q InterfaceDatabase.py db.py manage.py validation.py tests
      - name: Run real MySQL regression suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Commit tested assets to repair branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: integrate validated forms, reports and consistent inventory fixtures'
          git push origin HEAD:fix/audit-reliability-20260906
      - name: Package reviewed working tree
        if: always()
        run: |
          mkdir -p /tmp/repair-review
          tar --exclude=.git --exclude=__pycache__ --exclude=.pytest_cache -czf /tmp/repair-review/repository.tar.gz .
          cp test-results.xml /tmp/repair-review/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-source-and-test-results
          path: /tmp/repair-review/
          retention-days: 1
