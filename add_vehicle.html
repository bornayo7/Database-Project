{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Vehicle</h2>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label for="vin">VIN</label>
                <input name="vin" type="text" required id="vin" value="{{ values.get('vin', '') }}">
            </div>
            <div class="form-group">
                <label for="brand">Brand</label>
                <input name="brand" type="text" required id="brand" value="{{ values.get('brand', '') }}">
            </div>
            <div class="form-group">
                <label for="model">Model</label>
                <input name="model" type="text" required id="model" value="{{ values.get('model', '') }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="type">Type</label>
                <select name="type" id="type">
                    {% for option in vehicle_types %}
                    <option{% if values.get('type') == option %} selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <input name="year" type="number" min="1886" max="{{ max_year }}" required id="year" value="{{ values.get('year', '') }}">
            </div>
            <div class="form-group">
                <label for="miles">Miles</label>
                <input name="miles" type="number" min="0" required id="miles" value="{{ values.get('miles', '') }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="dealership_id">Dealership ID</label>
                <input name="dealership_id" type="number" min="1" required id="dealership_id" value="{{ values.get('dealership_id', '') }}">
            </div>
            <div class="form-group">
                <label for="bought_price">Bought Price</label>
                <input name="bought_price" type="number" step="0.01" min="0.01" required id="bought_price" value="{{ values.get('bought_price', '') }}">
            </div>
            <div class="form-group">
                <label for="listing_price">Listing Price</label>
                <input name="listing_price" id="listing_price" type="number" step="0.01" min="0.01" max="99999999.99" value="{{ values.get('listing_price', '') }}" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status">
                    {% for option in ('Available', 'Reserved') %}
                    <option{% if values.get('status') == option %} selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Vehicle</button>
        <a href="{{ url_for('web.vehicles') }}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
