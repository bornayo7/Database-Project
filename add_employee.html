{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Add New Employee</h2>
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name</label>
                <input name="name" type="text" required id="name" value="{{ values.get('name', '') }}">
            </div>
            <div class="form-group">
                <label for="position">Position</label>
                <select name="position" required id="position">
                    {% for option in positions %}
                    <option{% if values.get('position') == option %} selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input name="phone" type="text" id="phone" value="{{ values.get('phone', '') }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input name="email" type="email" required id="email" value="{{ values.get('email', '') }}">
            </div>
            <div class="form-group">
                <label for="dealership_id">Dealership ID</label>
                <input name="dealership_id" type="number" min="1" required id="dealership_id" value="{{ values.get('dealership_id', '') }}">
            </div>
        </div>
        <button type="submit" class="btn btn-success">Add Employee</button>
        <a href="{{ url_for('web.employees') }}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
