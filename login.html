{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Sign in</h1>
    {% if error %}<p class="flash-error" role="alert">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="form-group"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></div>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
{% endblock %}
